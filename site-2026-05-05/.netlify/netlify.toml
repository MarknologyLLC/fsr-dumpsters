headersOrigin = "config"
plugins = []
redirects = []

[functions]

[functions."*"]

[build]
publish = "/Users/centralhq/.openclaw/workspace/clients/kansas-city-dumpsters/site"
publishOrigin = "default"
base = "/Users/centralhq/.openclaw/workspace/clients/kansas-city-dumpsters/site"

[build.environment]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/assets/photos/*"

[headers.values]
Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/assets/icons/*"

[headers.values]
Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/assets/style.css"

[headers.values]
Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/assets/*.js"

[headers.values]
Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/robots.txt"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/llms.txt"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/llms-full.txt"

[headers.values]
Cache-Control = "public, max-age=86400"